<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Priori-Zen · Priorización Colaborativa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0d; --surface: #13131a; --border: rgba(255,255,255,0.08);
      --accent: #f0b429; --accent2: #ff4d6d; --green: #43d9ad;
      --text: #f0ede8; --muted: rgba(240,237,232,0.45); --radius: 12px;
    }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; }
    #app { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 24px 16px 48px; }
    .screen { width: 100%; max-width: 560px; animation: fadeUp 0.4s ease; }
    @keyframes fadeUp { from { opacity:0; transform: translateY(16px); } to { opacity:1; transform: translateY(0); } }
    .logo { font-family: 'Syne', sans-serif; font-weight: 900; font-size: 1.5rem; letter-spacing: -0.02em; color: var(--accent); margin-bottom: 40px; display: flex; align-items: center; gap: 8px; }
    .logo span { color: var(--text); }
    .badge { display: inline-block; font-size: 0.62rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); border: 1px solid var(--accent); padding: 3px 10px; border-radius: 2px; margin-bottom: 12px; }
    .hero-title { font-family: 'Syne', sans-serif; font-weight: 900; font-size: clamp(2.4rem, 8vw, 4rem); line-height: 1.05; letter-spacing: -0.03em; margin-bottom: 16px; }
    .hero-title em { font-style: italic; color: var(--accent); }
    .hero-sub { color: var(--muted); font-size: 0.95rem; line-height: 1.7; margin-bottom: 28px; }
    input[type=text] { width: 100%; padding: 14px 18px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); font-size: 1rem; font-family: 'DM Sans', sans-serif; outline: none; transition: border-color 0.2s; }
    input[type=text]:focus { border-color: var(--accent); }
    input[type=text]::placeholder { color: var(--muted); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 28px; border: none; border-radius: var(--radius); font-size: 0.95rem; font-weight: 700; cursor: pointer; transition: transform 0.15s, opacity 0.2s; font-family: 'Syne', sans-serif; }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--accent); color: #0a0a0d; }
    .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--muted); }
    .btn-danger { background: var(--accent2); color: white; }
    .btn-green { background: var(--green); color: #001a0f; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 12px; }
    .task-card { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 10px; cursor: grab; user-select: none; transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s; margin-bottom: 8px; }
    .task-card.dragging { opacity: 0.35; }
    .task-card.drag-over { transform: translateX(6px) scaleX(1.012); box-shadow: 0 0 0 2px white; }
    .task-rank { font-size: 0.65rem; font-weight: 900; letter-spacing: 0.1em; opacity: 0.55; min-width: 20px; text-align: center; font-family: 'Syne', sans-serif; }
    .task-text { flex: 1; font-weight: 600; font-size: clamp(0.82rem, 2.5vw, 0.92rem); }
    .task-arrows { display: flex; flex-direction: column; gap: 2px; }
    .arrow-btn { background: rgba(0,0,0,0.2); border: none; color: inherit; border-radius: 4px; width: 26px; height: 22px; cursor: pointer; font-size: 0.6rem; opacity: 0.65; }
    .drag-handle { font-size: 1rem; opacity: 0.28; }
    .stat-card { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 10px; margin-bottom: 8px; }
    .stat-bar-wrap { position: relative; margin-top: 5px; height: 5px; background: rgba(0,0,0,0.2); border-radius: 99px; overflow: hidden; }
    .stat-bar { height: 100%; border-radius: 99px; transition: width 1.2s cubic-bezier(0.34,1.56,0.64,1); }
    .participants { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
    .participant-chip { background: var(--surface); border: 1px solid var(--border); border-radius: 99px; padding: 4px 12px; font-size: 0.78rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
    .participant-chip.active { border-color: var(--green); color: var(--green); }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
    .session-code { font-family: 'Syne', sans-serif; font-size: 2.5rem; font-weight: 900; letter-spacing: 0.15em; color: var(--accent); text-align: center; padding: 20px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin: 16px 0; }
    .section-title { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
    .tag-input-wrap { display: flex; gap: 8px; margin-bottom: 10px; }
    .task-tag { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; font-size: 0.82rem; margin: 4px; }
    .task-tag button { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 0.75rem; padding: 0; }
    .tasks-tags-wrap { display: flex; flex-wrap: wrap; margin-bottom: 12px; min-height: 40px; }
    .progress-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 99px; height: 6px; margin: 12px 0; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--green); border-radius: 99px; transition: width 0.5s ease; }
    .copy-wrap { display: flex; gap: 8px; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; font-size: 0.82rem; color: var(--muted); overflow: hidden; }
    .copy-wrap span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .copy-btn { background: var(--accent); color: #0a0a0d; border: none; border-radius: 6px; padding: 5px 12px; font-size: 0.75rem; font-weight: 700; cursor: pointer; flex-shrink: 0; font-family: 'Syne', sans-serif; }
    hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
    #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: #1e1e2a; border: 1px solid var(--border); color: var(--text); padding: 10px 20px; border-radius: 99px; font-size: 0.85rem; transition: transform 0.3s ease; z-index: 999; white-space: nowrap; }
    #toast.show { transform: translateX(-50%) translateY(0); }
    .c0{background:#FF4D6D;color:#1a0005} .c1{background:#FF7C43;color:#1a0600} .c2{background:#F4BE37;color:#1a1000}
    .c3{background:#43D9AD;color:#001a0f} .c4{background:#4CC9F0;color:#001015} .c5{background:#7B5EA7;color:#f0ede8}
    .c6{background:#FF6B9D;color:#1a0010} .c7{background:#06D6A0;color:#001a11} .c8{background:#a78bfa;color:#0d001a}
    .c9{background:#fb923c;color:#1a0800}
    .choice-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
    .choice-btn { flex: 1; min-width: 180px; text-align: left; padding: 14px 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 0.85rem; }
    .choice-btn strong { display: block; color: var(--text); font-family: 'Syne', sans-serif; font-size: 0.9rem; margin-bottom: 2px; }
    .choice-btn.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); color: var(--text); }
    .discard-marked { outline: 2px solid var(--accent2); opacity: 0.55; }
    .round-pill { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 99px; padding: 6px 14px; font-size: 0.75rem; color: var(--accent); font-weight: 700; margin-bottom: 14px; font-family: 'Syne', sans-serif; letter-spacing: 0.04em; }
    .countdown { font-family: 'Syne', sans-serif; font-weight: 900; font-size: 1.1rem; color: var(--accent2); }
    .elim-tag { text-decoration: line-through; opacity: 0.5; }
    .mini-input-row { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
    .mini-input-row input[type=number] { width: 80px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: 'DM Sans', sans-serif; }
  </style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, get, onValue, update, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCKtAoskYSvWVAfFu0zSyWhyNbGWgKOcao",
  authDomain: "priori-zen.firebaseapp.com",
  databaseURL: "https://priori-zen-default-rtdb.firebaseio.com",
  projectId: "priori-zen",
  storageBucket: "priori-zen.firebasestorage.app",
  messagingSenderId: "538407233524",
  appId: "1:538407233524:web:226f748ae98f68c9147ba1"
};
const firebaseApp = initializeApp(firebaseConfig);
const db = getDatabase(firebaseApp);
const COLORS = ['c0','c1','c2','c3','c4','c5','c6','c7','c8','c9'];

function toast(msg, duration=2500) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), duration);
}
function render(html) { document.getElementById('app').innerHTML = html; }
function logo() { return `<div class="logo">Priori<span>Zen</span> ✦</div>`; }
function genCode() { return Math.random().toString(36).slice(2,8).toUpperCase(); }
function getSessionFromURL() { return new URLSearchParams(window.location.search).get('s'); }
function setSessionInURL(code) { const u = new URL(window.location); u.searchParams.set('s',code); window.history.pushState({},'',u); }

let state = { screen:'home', sessionCode:null, sessionData:null, playerName:null, playerId:null, items:[], listeners:[] };
function clearListeners() { state.listeners.forEach(u => u&&u()); state.listeners = []; }

function showHome() {
  clearListeners();
  const s = getSessionFromURL();
  if (s) { showJoin(s); return; }
  state.screen = 'home';
  render(`<div class="screen">
    ${logo()}
    <div class="badge">Priorización Colaborativa</div>
    <h1 class="hero-title">¿Qué importa<br><em>más?</em></h1>
    <p class="hero-sub">Crea una sesión, comparte el link y tu equipo ordena sus prioridades en tiempo real.</p>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="PZ.showModeSelect()">Crear sesión →</button>
      <button class="btn btn-secondary" onclick="PZ.promptJoin()">Unirme con código</button>
    </div>
  </div>`);
}

// Elegir entre el modo clásico (una sola ronda) y el modo de 3 rondas
// graduadas (issue backlog-global#375: junta regional — revisar/descartar
// 2, luego descartar 3, y priorizar los 5 finales). No se tocó el modo
// clásico: es un modo adicional que reutiliza sessions/{code}, votos y
// renderResults() donde aplica.
function showModeSelect() {
  state.screen = 'mode-select';
  render(`<div class="screen">
    ${logo()}
    <div class="badge">Nueva Sesión</div>
    <h2 style="font-family:'Syne',sans-serif;font-weight:800;font-size:1.8rem;margin-bottom:20px">¿Qué formato usamos?</h2>
    <div class="choice-row" style="flex-direction:column">
      <button class="choice-btn" onclick="PZ.showAdminSetup()"><strong>🎯 Ronda única</strong>Todos ordenan la lista completa una sola vez y se revela el resultado.</button>
      <button class="choice-btn" onclick="PZ.showRoundsSetup()"><strong>🏆 3 rondas graduadas</strong>Para juntas: Ronda 1 descarta 2 temas, Ronda 2 descarta 3 más, Ronda 3 prioriza los que queden. Con discusión en grupo entre rondas.</button>
    </div>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="PZ.showHome()">← Atrás</button>
    </div>
  </div>`);
}

function showAdminSetup() {
  state.screen = 'admin-setup';
  let tasks = ['🚀 Lanzar MVP al mercado','💡 Investigar nuevas tecnologías','🤝 Reunión con inversores','🐛 Corregir bugs críticos','📊 Analizar métricas','🎨 Rediseñar interfaz','📣 Campaña de marketing','🔐 Auditoría de seguridad'];
  function tagsHTML() { return tasks.map((t,i)=>`<span class="task-tag">${t}<button onclick="PZ._rt(${i})">✕</button></span>`).join(''); }
  PZ._rt = (i) => { tasks.splice(i,1); document.getElementById('tw').innerHTML=tagsHTML(); };
  PZ._at = () => { const v=document.getElementById('ti').value.trim(); if(!v)return; tasks.push(v); document.getElementById('ti').value=''; document.getElementById('tw').innerHTML=tagsHTML(); };
  // Pegar varios renglones de una vez: cada renglón se vuelve una tarea
  // aparte (Ej. pegar una lista copiada de notas/Excel), en vez de meter
  // todo el bloque como una sola tarea gigante con saltos de línea. Un
  // pegado de una sola línea (o sin salto de línea) sigue el flujo normal
  // del input — no se intercepta.
  PZ._pt = (e) => {
    const text = (e.clipboardData || window.clipboardData)?.getData('text') || '';
    if (!text.includes('\n')) return;
    e.preventDefault();
    const lineas = text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
    if (!lineas.length) return;
    lineas.forEach(l=>tasks.push(l));
    document.getElementById('ti').value = '';
    document.getElementById('tw').innerHTML = tagsHTML();
    toast(`✅ ${lineas.length} tarea${lineas.length!==1?'s':''} agregada${lineas.length!==1?'s':''}`);
  };
  PZ._create = async () => {
    const title = document.getElementById('st').value.trim() || 'Sesión sin título';
    if (tasks.length < 2) { toast('⚠️ Agrega al menos 2 tareas'); return; }
    const code = genCode();
    // Antes, si `set()` fallaba (Ej. reglas de Firebase denegando el
    // escritura), el botón "Crear sesión" no hacía absolutamente nada
    // visible — el error solo quedaba en la consola del navegador. Con
    // try/catch se avisa con un toast en vez de quedarse "muerto".
    try {
      await set(ref(db,`sessions/${code}`), { title, tasks, status:'waiting', createdAt: serverTimestamp() });
    } catch (e) {
      toast(`❌ No se pudo crear la sesión: ${e.message}`, 4000);
      return;
    }
    state.sessionCode = code;
    setSessionInURL(code);
    showAdminPanel(code);
  };
  render(`<div class="screen">
    ${logo()}
    <div class="badge">Nueva Sesión</div>
    <h2 style="font-family:'Syne',sans-serif;font-weight:800;font-size:1.8rem;margin-bottom:20px">Configura tu sesión</h2>
    <div class="section-title">Nombre de la sesión</div>
    <input type="text" id="st" placeholder="Ej. Prioridades Q3 · Equipo Producto" style="margin-bottom:20px"/>
    <div class="section-title">Tareas a priorizar</div>
    <div class="tasks-tags-wrap" id="tw">${tagsHTML()}</div>
    <div class="tag-input-wrap">
      <input type="text" id="ti" placeholder="Agregar tarea... (o pega varias líneas)" onkeydown="if(event.key==='Enter')PZ._at()" onpaste="PZ._pt(event)"/>
      <button class="btn btn-secondary" onclick="PZ._at()" style="padding:14px 18px;flex-shrink:0">+ Agregar</button>
    </div>
    <p style="color:var(--muted);font-size:0.72rem;margin:-4px 0 12px">💡 Pega texto de varios renglones y cada uno se agrega como una tarea aparte.</p>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="PZ._create()">Crear sesión →</button>
      <button class="btn btn-secondary" onclick="PZ.showHome()">← Atrás</button>
    </div>
  </div>`);
}

function showAdminPanel(code) {
  clearListeners();
  state.screen = 'admin';
  const link = `${location.origin}${location.pathname}?s=${code}`;
  render(`<div class="screen">
    ${logo()}
    <div class="badge">Panel Admin</div>
    <h2 style="font-family:'Syne',sans-serif;font-weight:800;font-size:1.5rem;margin-bottom:4px" id="at">Cargando...</h2>
    <p style="color:var(--muted);font-size:0.85rem;margin-bottom:16px" id="as">⏳ Esperando participantes...</p>
    <div class="section-title">Comparte este link</div>
    <div class="copy-wrap"><span>${link}</span><button class="copy-btn" onclick="PZ._copy('${link}')">Copiar</button></div>
    <p style="color:var(--muted);font-size:0.8rem;margin:8px 0 4px">O el código:</p>
    <div class="session-code">${code}</div>
    <div class="section-title" style="margin-top:20px">Participantes en vivo</div>
    <div id="pw" class="participants"></div>
    <div id="pgw" style="display:none">
      <div class="progress-wrap"><div class="progress-fill" id="pf" style="width:0%"></div></div>
      <p style="color:var(--muted);font-size:0.8rem;text-align:center;margin-top:4px" id="pl"></p>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="PZ._start()">▶ Iniciar sesión</button>
      <button class="btn btn-danger" onclick="PZ._close()">Cerrar sesión</button>
    </div>
    <div id="rp" style="margin-top:24px"></div>
  </div>`);
  PZ._copy = (u) => navigator.clipboard.writeText(u).then(()=>toast('✓ Link copiado'));
  PZ._start = async () => { try { await update(ref(db,`sessions/${code}`),{status:'active'}); toast('✅ Sesión iniciada'); } catch(e){ toast(`❌ ${e.message}`,4000); } };
  PZ._close = async () => { try { await update(ref(db,`sessions/${code}`),{status:'closed'}); toast('🔒 Sesión cerrada'); } catch(e){ toast(`❌ ${e.message}`,4000); } };
  const unsub = onValue(ref(db,`sessions/${code}`), snap => {
    if (!snap.exists()) return;
    const d = snap.val();
    const el = (id) => document.getElementById(id);
    if(el('at')) el('at').textContent = d.title;
    const sm = {waiting:'⏳ Esperando — comparte el link', active:'🟢 Sesión activa', closed:'🔒 Cerrada'};
    if(el('as')) el('as').textContent = sm[d.status]||'';
    const votes = d.votes ? Object.values(d.votes) : [];
    const joined = d.joined ? Object.values(d.joined) : [];
    if(el('pw')) el('pw').innerHTML = joined.map(p=>{
      const v = votes.some(x=>x.playerId===p.id);
      return `<div class="participant-chip ${v?'active':''}">${v?'<div class="dot"></div>':''}${p.name}${v?' ✓':''}</div>`;
    }).join('') || '<p style="color:var(--muted);font-size:0.85rem">Nadie se ha unido aún...</p>';
    if(joined.length>0&&el('pgw')){ el('pgw').style.display='block'; const pct=Math.round(votes.length/joined.length*100); if(el('pf'))el('pf').style.width=pct+'%'; if(el('pl'))el('pl').textContent=`${votes.length} de ${joined.length} han votado (${pct}%)`; }
    if(votes.length>0) renderResults('rp', d.tasks, votes, false);
  });
  state.listeners.push(unsub);
}

function showJoin(code) {
  clearListeners();
  state.sessionCode = code;
  get(ref(db,`sessions/${code}`)).then(snap => {
    if (!snap.exists()) { render(`<div class="screen">${logo()}<p style="color:var(--muted)">Sesión no encontrada.</p><div class="btn-row"><button class="btn btn-secondary" onclick="PZ.showHome()">← Inicio</button></div></div>`); return; }
    const d = snap.val();
    if (d.status==='closed' && d.mode!=='rounds') { render(`<div class="screen">${logo()}<p style="color:var(--muted)">Esta sesión ya está cerrada.</p><div class="btn-row"><button class="btn btn-secondary" onclick="PZ.showHome()">← Inicio</button></div></div>`); return; }
    render(`<div class="screen">
      ${logo()}
      <div class="badge">Unirse</div>
      <h2 style="font-family:'Syne',sans-serif;font-weight:800;font-size:1.8rem;margin-bottom:8px">${d.title}</h2>
      <p style="color:var(--muted);font-size:0.9rem;margin-bottom:28px">Código: <strong style="color:var(--accent);letter-spacing:0.1em">${code}</strong></p>
      <div class="section-title">¿Cómo te llamas?</div>
      <input type="text" id="pn" placeholder="Tu nombre o alias..." style="margin-bottom:20px" onkeydown="if(event.key==='Enter')PZ._join()"/>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="PZ._join()">Entrar →</button>
        <button class="btn btn-secondary" onclick="PZ.showHome()">← Atrás</button>
      </div>
    </div>`);
    PZ._join = async () => {
      const name = document.getElementById('pn').value.trim();
      if (!name) { toast('⚠️ Escribe tu nombre'); return; }
      const pid = `p_${Date.now()}_${Math.random().toString(36).slice(2,5)}`;
      state.playerName = name; state.playerId = pid;
      try {
        await set(ref(db,`sessions/${code}/joined/${pid}`),{name,id:pid,joinedAt:serverTimestamp()});
      } catch (e) {
        toast(`❌ No se pudo entrar: ${e.message}`, 4000);
        return;
      }
      if (d.mode === 'rounds') { showRoundsGame(code, pid, name); return; }
      showGame(code, d, pid, name);
    };
  });
}

function promptJoin() {
  render(`<div class="screen">
    ${logo()}
    <div class="badge">Unirse</div>
    <h2 style="font-family:'Syne',sans-serif;font-weight:800;font-size:1.8rem;margin-bottom:20px">Ingresa el código</h2>
    <input type="text" id="ci" placeholder="Ej. AB12CD" maxlength="6" style="text-align:center;font-size:1.5rem;letter-spacing:0.2em;text-transform:uppercase;margin-bottom:20px" onkeydown="if(event.key==='Enter')PZ._gj()"/>
    <div class="btn-row">

      <button class="btn btn-secondary" onclick="PZ.showHome()">← Atrás</button>

  </div>`);
  PZ._gj = () => { const c=document.getElementById('ci').value.trim().toUpperCase(); if(c.length<4){toast('⚠️ Código inválido');return;} setSessionInURL(c); showJoin(c); };

}

function showGame(code, sessionData, playerId, playerName) {
  clearListeners();
  state.screen = 'game';
  state.items = sessionData.tasks.map((t,i)=>({id:i,text:t,color:COLORS[i%COLORS.length]}));
  state.items.sort(()=>Math.random()-0.5);
  let dragSrc = null;
  let submitted = false;

  function cardsHTML() {
    return state.items.map((item,idx)=>`
      <div class="task-card ${item.color}" draggable="true" data-idx="${idx}"
        ondragstart="PZ._ds(${idx})" ondragenter="PZ._de(${idx})" ondragend="PZ._dd()" ondragover="event.preventDefault()">
        <div class="task-rank">${idx+1}</div>
        <div class="task-text">${item.text}</div>
        <div class="task-arrows">
          <button class="arrow-btn" onclick="PZ._mv(${idx},-1)" ${idx===0?'disabled':''}>▲</button>
          <button class="arrow-btn" onclick="PZ._mv(${idx},1)" ${idx===state.items.length-1?'disabled':''}>▼</button>
        </div>
        <div class="drag-handle">⠿</div>
      </div>`).join('');
  }
  function refresh() { const w=document.getElementById('cw'); if(w) w.innerHTML=cardsHTML(); }

  PZ._ds = (i) => { dragSrc=i; };
  PZ._de = (i) => { if(dragSrc===null||dragSrc===i)return; const c=[...state.items]; const[m]=c.splice(dragSrc,1); c.splice(i,0,m); state.items=c; dragSrc=i; refresh(); };
  PZ._dd = () => { dragSrc=null; };
  PZ._mv = (i,d) => { const t=i+d; if(t<0||t>=state.items.length)return; [state.items[i],state.items[t]]=[state.items[t],state.items[i]]; refresh(); };
  PZ._submit = async () => {
    if(submitted)return; submitted=true;
    try {
      await set(ref(db,`sessions/${code}/votes/${playerId}`),{playerId,playerName,order:state.items.map(x=>x.text),submittedAt:serverTimestamp()});
    } catch (e) {
      submitted = false;
      toast(`❌ No se pudo enviar tu voto: ${e.message}`, 4000);
      return;
    }
    toast('✅ ¡Voto enviado!');
    showWaiting(code, playerName);
  };

  const unsub = onValue(ref(db,`sessions/${code}/status`), s=>{ if(s.val()==='closed') showResults(code); });
  state.listeners.push(unsub);

  render(`<div class="screen">
    ${logo()}
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px">
      <div>
        <div class="badge">Ordenando</div>
        <h2 style="font-family:'Syne',sans-serif;font-weight:800;font-size:1.4rem;margin:4px 0">Hola, ${playerName} 👋</h2>
        <p style="color:var(--muted);font-size:0.8rem">${sessionData.title}</p>
      </div>
      <button onclick="PZ._sh()" style="background:rgba(255,255,255,0.06);border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:8px 12px;font-size:0.8rem;cursor:pointer;margin-top:4px">⟳ Mezclar</button>
    </div>
    <p style="color:var(--muted);font-size:0.78rem;margin-bottom:12px">Arrastra o usa ▲▼ · Nº1 = más importante</p>
    <div id="cw">${cardsHTML()}</div>
    <div class="btn-row" style="padding:8px 0 16px">
      <button class="btn btn-green" onclick="PZ._submit()">Enviar mi orden ✓</button>
    </div>
  </div>`);
  PZ._sh = () => { state.items.sort(()=>Math.random()-0.5); refresh(); };
}

function showWaiting(code, playerName) {
  clearListeners();
  render(`<div class="screen" style="text-align:center;padding-top:60px">
    ${logo()}
    <div style="font-size:3rem;margin-bottom:16px">🧘</div>
    <h2 style="font-family:'Syne',sans-serif;font-weight:800;font-size:1.6rem;margin-bottom:8px">¡Listo, ${playerName}!</h2>
    <p style="color:var(--muted);margin-bottom:24px">Tu voto fue registrado.<br>Esperando a que todos terminen...</p>
    <div id="wp" class="participants" style="justify-content:center"></div>
    <div class="progress-wrap" style="margin-top:16px"><div class="progress-fill" id="wpr" style="width:0%"></div></div>
    <p style="color:var(--muted);font-size:0.8rem;text-align:center;margin-top:6px" id="wl">Calculando...</p>

    const joined=d.joined?Object.values(d.joined):[];

    if(wp) wp.innerHTML=joined.map(p=>{const v=votes.some(x=>x.playerId===p.id);return`<div class="participant-chip ${v?'active':''}">${v?'<div class="dot"></div>':''}${p.name}</div>`;}).join('');
    const pct=joined.length>0?Math.round(votes.length/joined.length*100):0;
    const pr=document.getElementById('wpr'); if(pr)pr.style.width=pct+'%';
    const wl=document.getElementById('wl'); if(wl)wl.textContent=`${votes.length} de ${joined.length} han votado`;

function showResults(code) {
  clearListeners();
  get(ref(db,`sessions/${code}`)).then(snap=>{
    if(!snap.exists())return;
    const d=snap.val();
    const votes=d.votes?Object.values(d.votes):[];
    render(`<div class="screen">
      ${logo()}
      <div class="badge">Resultado Colectivo</div>
      <h2 style="font-family:'Syne',sans-serif;font-weight:800;font-size:1.6rem;margin-bottom:4px">${d.title}</h2>
      <p style="color:var(--muted);font-size:0.85rem;margin-bottom:20px">${votes.length} participante${votes.length!==1?'s':''} votaron</p>
      <div id="rm"></div>
      <hr/>
      <div class="section-title">Quiénes participaron</div>
      <div class="participants">${votes.map(v=>`<div class="participant-chip active"><div class="dot"></div>${v.playerName}</div>`).join('')}</div>
      <div class="btn-row" style="margin-top:24px">
        <button class="btn btn-primary" onclick="PZ.showHome()">← Inicio</button>
      </div>
    </div>`);
    renderResults('rm', d.tasks, votes, true);
  });
}

function renderResults(id, tasks, votes, animated) {
  if(!votes||votes.length===0)return;
  const sums={},counts={};
  tasks.forEach(t=>{sums[t]=0;counts[t]=0;});
  votes.forEach(v=>{ if(!v.order)return; v.order.forEach((t,r)=>{ if(sums[t]!==undefined){sums[t]+=r;counts[t]++;} }); });
  const ranked=tasks.map((t,i)=>({text:t,color:COLORS[i%COLORS.length],avg:counts[t]>0?sums[t]/counts[t]:99})).sort((a,b)=>a.avg-b.avg);
  const el=document.getElementById(id); if(!el)return;
  el.innerHTML=ranked.map((item,idx)=>{
    const pct=Math.max(8,100-item.avg*12);
    return `<div class="stat-card ${item.color}">
      <div class="task-rank">${idx+1}</div>
      <div style="flex:1">
        <div class="task-text">${item.text}</div>
        <div class="stat-bar-wrap"><div class="stat-bar" id="b${id}${idx}" style="width:${animated?0:pct}%;background:rgba(0,0,0,0.25)"></div></div>
        <div style="font-size:0.7rem;opacity:0.6;margin-top:4px">Promedio: ${item.avg.toFixed(1)}</div>
      </div>
      ${idx===0?'<div style="font-size:1.3rem">👑</div>':''}
    </div>`;
  }).join('');
  if(animated) ranked.forEach((item,idx)=>{ const pct=Math.max(8,100-item.avg*12); setTimeout(()=>{ const b=document.getElementById(`b${id}${idx}`); if(b)b.style.width=pct+'%'; },idx*120); });
}

// ============================================================================
// MODO "3 RONDAS GRADUADAS" (backlog-global#375, "Priori-Zen para juntas")
// ----------------------------------------------------------------------------
// Reutiliza el mismo nodo sessions/{code} y el mismo genCode()/joined/toast()
// que el modo clásico — es un modo adicional (sessions/{code}.mode==='rounds'),
// no reemplaza al de una sola ronda (showAdminSetup/showGame siguen intactos).
//
// Mecánica (del pedido original: "revisamos dos... revisamos tres...
// priorizamos cinco", 2+3=5 descartados de 10 → quedan 5 para priorizar):
//   Ronda 1: cada quien descarta (en privado) 2 de los temas restantes.
//   Ronda 2: cada quien descarta 3 más de los que sobrevivieron.
//   Ronda 3: cada quien prioriza (ordena) los que quedaron.
// Entre rondas se revela el agregado (qué se descartó/cómo quedó, con
// conteos) para discutir en grupo antes de seguir — nunca el voto individual
// de nadie, solo el agregado, igual que el modo clásico.
//
// Origen de los 10 temas: precargados por el facilitador (como el modo
// clásico) o recolectados en vivo (topicSubs/{pid}) antes de abrir la Ronda 1.
// Tiempo por ronda: manual (botón del facilitador) o cronómetro automático
// (roundDeadline en sessions/{code}, revisado del lado del facilitador).
function discardCountFor(round) { return round===1 ? 2 : 3; }
function roundLabel(round) { return round===1?'Ronda 1 · Descartar 2':round===2?'Ronda 2 · Descartar 3':'Ronda 3 · Priorizar'; }

function showRoundsSetup() {
  state.screen = 'rounds-setup';
  let tasks = ['🚀 Lanzar MVP al mercado','💡 Investigar nuevas tecnologías','🤝 Reunión con inversores','🐛 Corregir bugs críticos','📊 Analizar métricas','🎨 Rediseñar interfaz','📣 Campaña de marketing','🔐 Auditoría de seguridad','🌎 Expansión regional','👥 Contratación clave'];
  let cfg = { topicsSource:'preloaded', timerMode:'manual', timerMinutes:5 };
  function tagsHTML() { return tasks.map((t,i)=>`<span class="task-tag">${t}<button onclick="PZ._rrt(${i})">✕</button></span>`).join(''); }
  PZ._rrt = (i) => { tasks.splice(i,1); const w=document.getElementById('tw'); if(w) w.innerHTML=tagsHTML(); };
  PZ._rat = () => { const v=document.getElementById('ti').value.trim(); if(!v)return; tasks.push(v); document.getElementById('ti').value=''; document.getElementById('tw').innerHTML=tagsHTML(); };
  PZ._rSrc = (v) => { cfg.topicsSource=v; renderSetup(); };
  PZ._rTimer = (v) => { cfg.timerMode=v; renderSetup(); };
  PZ._createRounds = async () => {
    const title = document.getElementById('st').value.trim() || 'Junta regional';
    const minutesEl = document.getElementById('rmin');
    if (minutesEl) cfg.timerMinutes = Math.max(1, parseInt(minutesEl.value,10) || 5);
    if (cfg.topicsSource==='preloaded' && tasks.length < 6) { toast('⚠️ Agrega al menos 6 temas (se descartan 2+3)'); return; }
    const code = genCode();
    const payload = {
      title, mode:'rounds', topicsSource:cfg.topicsSource, timerMode:cfg.timerMode,
      timerMinutes: cfg.timerMode==='auto' ? cfg.timerMinutes : null,
      status: cfg.topicsSource==='live' ? 'collecting' : 'waiting',
      round: 0, createdAt: serverTimestamp(),
    };
    if (cfg.topicsSource==='preloaded') { payload.allTopics = tasks; payload.remaining = tasks; }
    try {
      await set(ref(db,`sessions/${code}`), payload);
    } catch (e) { toast(`❌ No se pudo crear la sesión: ${e.message}`, 4000); return; }
    state.sessionCode = code;
    setSessionInURL(code);
    showRoundsAdminPanel(code);
  };
  function renderSetup() {
    render(`<div class="screen">
      ${logo()}
      <div class="badge">3 Rondas · Nueva Sesión</div>
      <h2 style="font-family:'Syne',sans-serif;font-weight:800;font-size:1.8rem;margin-bottom:20px">Configura la junta</h2>
      <div class="section-title">Nombre de la sesión</div>
      <input type="text" id="st" placeholder="Ej. Junta de Gerentes Regionales" style="margin-bottom:20px"/>
      <div class="section-title">¿De dónde salen los temas?</div>
      <div class="choice-row">
        <button class="choice-btn ${cfg.topicsSource==='preloaded'?'selected':''}" onclick="PZ._rSrc('preloaded')"><strong>📋 Ya tengo mis temas</strong>Los capturas tú antes de la junta.</button>
        <button class="choice-btn ${cfg.topicsSource==='live'?'selected':''}" onclick="PZ._rSrc('live')"><strong>🎤 Recolectar en vivo</strong>Cada participante propone temas al entrar.</button>
      </div>
      ${cfg.topicsSource==='preloaded' ? `
      <div class="section-title">Temas a priorizar (mínimo 6, ideal 10)</div>
      <div class="tasks-tags-wrap" id="tw">${tagsHTML()}</div>
      <div class="tag-input-wrap">
        <input type="text" id="ti" placeholder="Agregar tema..." onkeydown="if(event.key==='Enter')PZ._rat()"/>
        <button class="btn btn-secondary" onclick="PZ._rat()" style="padding:14px 18px;flex-shrink:0">+ Agregar</button>
      </div>` : `<p style="color:var(--muted);font-size:0.82rem;margin-bottom:20px">Los participantes escribirán sus temas al unirse; tú cierras la recolección cuando estén listos y arrancamos la Ronda 1.</p>`}
      <div class="section-title">Tiempo por ronda</div>
      <div class="choice-row">
        <button class="choice-btn ${cfg.timerMode==='manual'?'selected':''}" onclick="PZ._rTimer('manual')"><strong>✋ Modo manual</strong>Tú avanzas de ronda cuando el grupo esté listo.</button>
        <button class="choice-btn ${cfg.timerMode==='auto'?'selected':''}" onclick="PZ._rTimer('auto')"><strong>⏱ Cronómetro automático</strong>Cada ronda cierra sola al vencer el tiempo.</button>
      </div>
      ${cfg.timerMode==='auto' ? `<div class="mini-input-row" style="margin-bottom:20px"><span style="color:var(--muted);font-size:0.85rem">Minutos por ronda:</span><input type="number" id="rmin" value="${cfg.timerMinutes}" min="1" max="60"/></div>` : ''}
      <div class="btn-row">
        <button class="btn btn-primary" onclick="PZ._createRounds()">Crear sesión →</button>
        <button class="btn btn-secondary" onclick="PZ.showModeSelect()">← Atrás</button>
      </div>
    </div>`);
  }
  renderSetup();
}

function showRoundsAdminPanel(code) {
  clearListeners();
  state.screen = 'rounds-admin';
  let timerHandle = null;
  const unsub = onValue(ref(db,`sessions/${code}`), snap => {
    if (!snap.exists()) return;
    renderRoundsAdmin(code, snap.val());
  });
  state.listeners.push(unsub);
  state.listeners.push(() => { if (timerHandle) clearInterval(timerHandle); });

  function renderRoundsAdmin(code, d) {
    const link = `${location.origin}${location.pathname}?s=${code}`;
    if (timerHandle) { clearInterval(timerHandle); timerHandle = null; }

    PZ._copyR = (u) => navigator.clipboard.writeText(u).then(()=>toast('✓ Link copiado'));
    PZ._closeCollecting = async () => {
      try {
        const snap = await get(ref(db,`sessions/${code}/topicSubs`));
        const subs = snap.exists() ? Object.values(snap.val()) : [];
        const all = [];
        subs.forEach(s => (s.topics||[]).forEach(t => { if (t && !all.includes(t)) all.push(t); }));
        if (all.length < 6) { toast('⚠️ Necesitas al menos 6 temas recolectados'); return; }
        await update(ref(db,`sessions/${code}`), { allTopics: all, remaining: all, status:'waiting' });
      } catch (e) { toast(`❌ ${e.message}`, 4000); }
    };
    PZ._startRound1 = async () => {
      try {
        await update(ref(db,`sessions/${code}`), {
          round: 1, status:'active',
          roundDeadline: d.timerMode==='auto' ? Date.now()+d.timerMinutes*60000 : null,
        });
      } catch (e) { toast(`❌ ${e.message}`, 4000); }
    };
    PZ._forceCloseRound = async () => { await closeCurrentRound(code, d); };
    PZ._nextRound = async () => {
      const nextRound = (d.round||0) + 1;
      try {
        await update(ref(db,`sessions/${code}`), {
          round: nextRound, status:'active',
          roundDeadline: d.timerMode==='auto' ? Date.now()+d.timerMinutes*60000 : null,
        });
      } catch (e) { toast(`❌ ${e.message}`, 4000); }
    };
    PZ._closeSessionR = async () => { try { await update(ref(db,`sessions/${code}`),{status:'closed'}); } catch(e){ toast(`❌ ${e.message}`,4000);} };

    const shareBlock = `
      <div class="section-title">Comparte este link</div>
      <div class="copy-wrap"><span>${link}</span><button class="copy-btn" onclick="PZ._copyR('${link}')">Copiar</button></div>
      <p style="color:var(--muted);font-size:0.8rem;margin:8px 0 4px">O el código:</p>
      <div class="session-code">${code}</div>`;

    if (d.status === 'collecting') {
      const subs = d.topicSubs ? Object.values(d.topicSubs) : [];
      const total = subs.reduce((n,s)=>n+((s.topics||[]).length),0);
      render(`<div class="screen">
        ${logo()}
        <div class="badge">Panel Admin · Recolectando temas</div>
        <h2 style="font-family:'Syne',sans-serif;font-weight:800;font-size:1.5rem;margin-bottom:4px">${d.title}</h2>
        <p style="color:var(--muted);font-size:0.85rem;margin-bottom:16px">🎤 Esperando que el grupo proponga temas...</p>
        ${shareBlock}
        <div class="section-title" style="margin-top:20px">Participantes (${subs.length}) · ${total} tema${total!==1?'s':''} propuestos</div>
        <div class="participants">${subs.map(s=>`<div class="participant-chip ${(s.topics||[]).length?'active':''}">${(s.topics||[]).length?'<div class="dot"></div>':''}${s.name} (${(s.topics||[]).length})</div>`).join('') || '<p style="color:var(--muted);font-size:0.85rem">Nadie se ha unido aún...</p>'}</div>
        <div class="btn-row">
          <button class="btn btn-primary" onclick="PZ._closeCollecting()">Cerrar recolección →</button>
          <button class="btn btn-danger" onclick="PZ._closeSessionR()">Cerrar sesión</button>
        </div>
      </div>`);
      return;
    }

    if (d.status === 'waiting') {
      const joined = d.joined ? Object.values(d.joined) : [];
      render(`<div class="screen">
        ${logo()}
        <div class="badge">Panel Admin</div>
        <h2 style="font-family:'Syne',sans-serif;font-weight:800;font-size:1.5rem;margin-bottom:4px">${d.title}</h2>
        <p style="color:var(--muted);font-size:0.85rem;margin-bottom:16px">⏳ Listo para arrancar la Ronda 1 · ${(d.allTopics||[]).length} temas</p>
        ${shareBlock}
        <div class="section-title" style="margin-top:20px">Participantes en vivo</div>
        <div class="participants">${joined.map(p=>`<div class="participant-chip">${p.name}</div>`).join('') || '<p style="color:var(--muted);font-size:0.85rem">Nadie se ha unido aún...</p>'}</div>
        <div class="tasks-tags-wrap">${(d.allTopics||[]).map(t=>`<span class="task-tag">${t}</span>`).join('')}</div>
        <div class="btn-row">
          <button class="btn btn-primary" onclick="PZ._startRound1()">▶ Iniciar Ronda 1</button>
          <button class="btn btn-danger" onclick="PZ._closeSessionR()">Cerrar sesión</button>
        </div>
      </div>`);
      return;
    }

    if (d.status === 'active') {
      const votes = (d.roundVotes && d.roundVotes[d.round]) ? Object.values(d.roundVotes[d.round]) : [];
      const joined = d.joined ? Object.values(d.joined) : [];
      const pct = joined.length ? Math.round(votes.length/joined.length*100) : 0;
      render(`<div class="screen">
        ${logo()}
        <div class="round-pill">${roundLabel(d.round)}</div>
        <h2 style="font-family:'Syne',sans-serif;font-weight:800;font-size:1.5rem;margin-bottom:4px">${d.title}</h2>
        <p style="color:var(--muted);font-size:0.85rem;margin-bottom:16px">🟢 En curso · ${(d.remaining||[]).length} temas en juego</p>
        <div id="cd" style="margin-bottom:12px"></div>
        <div class="progress-wrap"><div class="progress-fill" style="width:${pct}%"></div></div>
        <p style="color:var(--muted);font-size:0.8rem;text-align:center;margin:6px 0 16px">${votes.length} de ${joined.length} han votado (${pct}%)</p>
        <div class="participants">${joined.map(p=>{const v=votes.some(x=>x.playerId===p.id);return `<div class="participant-chip ${v?'active':''}">${v?'<div class="dot"></div>':''}${p.name}${v?' ✓':''}</div>`;}).join('') || '<p style="color:var(--muted);font-size:0.85rem">Nadie se ha unido aún...</p>'}</div>
        <div class="btn-row">
          <button class="btn btn-primary" onclick="PZ._forceCloseRound()">Cerrar ronda y revelar →</button>
          <button class="btn btn-danger" onclick="PZ._closeSessionR()">Cerrar sesión</button>
        </div>
      </div>`);
      if (d.timerMode === 'auto' && d.roundDeadline) {
        const tick = () => {
          const left = Math.max(0, Math.round((d.roundDeadline - Date.now())/1000));
          const el = document.getElementById('cd');
          if (el) el.innerHTML = `<span class="countdown">⏱ ${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}</span>`;
          if (left <= 0) { clearInterval(timerHandle); timerHandle=null; closeCurrentRound(code, d); }
        };
        tick();
        timerHandle = setInterval(tick, 1000);
      }
      return;
    }

    if (d.status === 'round-result') {
      const rr = (d.roundResults && d.roundResults[d.round]) || {counts:{},eliminated:[]};
      const base = d.round===1 ? (d.allTopics||[]) : (d.roundResults && d.roundResults[d.round-1] ? d.roundResults[d.round-1].remainingAfter : d.remaining) || [];
      const rowsHTML = base.map((t,i)=>{
        const c = rr.counts ? (rr.counts[t]||0) : 0;
        const out = (rr.eliminated||[]).includes(t);
        return `<div class="stat-card ${COLORS[i%COLORS.length]}"><div style="flex:1"><div class="task-text ${out?'elim-tag':''}">${t}</div><div style="font-size:0.7rem;opacity:0.6;margin-top:4px">${out?'❌ Descartado':'✅ Sigue'} · ${c} voto${c!==1?'s':''} de descarte</div></div></div>`;
      }).join('');
      const isLast = d.round >= 3;
      render(`<div class="screen">
        ${logo()}
        <div class="round-pill">${roundLabel(d.round)} · Resultado</div>
        <h2 style="font-family:'Syne',sans-serif;font-weight:800;font-size:1.5rem;margin-bottom:12px">${d.title}</h2>
        <p style="color:var(--muted);font-size:0.85rem;margin-bottom:12px">Discútanlo en grupo antes de seguir.</p>
        <div>${rowsHTML}</div>
        <div class="btn-row">
          ${isLast ? '' : `<button class="btn btn-primary" onclick="PZ._nextRound()">Siguiente ronda →</button>`}
          <button class="btn btn-danger" onclick="PZ._closeSessionR()">Cerrar sesión</button>
        </div>
      </div>`);
      return;
    }

    if (d.status === 'closed') {
      const rr = (d.roundResults && d.roundResults[3]) || {ranked:[]};
      render(`<div class="screen">
        ${logo()}
        <div class="badge">Resultado Final</div>
        <h2 style="font-family:'Syne',sans-serif;font-weight:800;font-size:1.5rem;margin-bottom:16px">${d.title}</h2>
        <div>${(rr.ranked||[]).map((item,idx)=>`<div class="stat-card ${COLORS[idx%COLORS.length]}"><div class="task-rank">${idx+1}</div><div style="flex:1"><div class="task-text">${item.text}</div><div style="font-size:0.7rem;opacity:0.6;margin-top:4px">Promedio: ${item.avg.toFixed(1)}</div></div>${idx===0?'<div style="font-size:1.3rem">👑</div>':''}</div>`).join('') || '<p style="color:var(--muted)">Sesión cerrada sin resultado final.</p>'}</div>
        <div class="btn-row">
          <button class="btn btn-primary" onclick="PZ.showHome()">← Inicio</button>
        </div>
      </div>`);
      return;
    }
  }
}

// Calcula y guarda el cierre de la ronda actual: descarta (rondas 1-2) o
// prioriza (ronda 3), y avanza status a 'round-result' (o 'closed' si era
// la ronda 3). Se llama tanto del botón manual como del cronómetro.
async function closeCurrentRound(code, d) {
  try {
    const votesSnap = await get(ref(db,`sessions/${code}`));
    if (!votesSnap.exists()) return;
    const fresh = votesSnap.val();
    if (fresh.status !== 'active') return; // ya se cerró (evita doble disparo)
    const round = fresh.round;
    const roundVotes = (fresh.roundVotes && fresh.roundVotes[round]) || {};
    if (round === 3) {
      const remaining = fresh.remaining || [];
      const votes = Object.values(roundVotes);
      const sums={},counts={};
      remaining.forEach(t=>{sums[t]=0;counts[t]=0;});
      votes.forEach(v=>{ if(!v.order)return; v.order.forEach((t,r)=>{ if(sums[t]!==undefined){sums[t]+=r;counts[t]++;} }); });
      const ranked = remaining.map(t=>({text:t,avg:counts[t]>0?sums[t]/counts[t]:99})).sort((a,b)=>a.avg-b.avg);
      await update(ref(db,`sessions/${code}`), { [`roundResults/3`]: { ranked }, status:'closed' });
    } else {
      const remaining = fresh.remaining || fresh.allTopics || [];
      const discardCount = discardCountFor(round);
      const votes = Object.values(roundVotes);
      const counts = {}; remaining.forEach(t=>counts[t]=0);
      votes.forEach(v=>{ (v.discard||[]).forEach(t=>{ if(counts[t]!==undefined) counts[t]++; }); });
      const withIdx = remaining.map((t,i)=>({t,i,c:counts[t]}));
      withIdx.sort((a,b)=> b.c-a.c || a.i-b.i);
      const eliminated = withIdx.slice(0,Math.min(discardCount,remaining.length-1)).map(x=>x.t);
      const remainingAfter = remaining.filter(t=>!eliminated.includes(t));
      await update(ref(db,`sessions/${code}`), {
        [`roundResults/${round}`]: { counts, eliminated, remainingAfter },
        remaining: remainingAfter, status:'round-result',
      });
    }
  } catch (e) { toast(`❌ ${e.message}`, 4000); }
}

function showRoundsGame(code, pid, name) {
  clearListeners();
  state.screen = 'rounds-game';
  let myTopics = [];
  let marked = [];
  let orderItems = [];
  let dragSrc = null;
  let submittedFor = null; // ronda ya enviada, para no reenviar

  const unsub = onValue(ref(db,`sessions/${code}`), snap => {
    if (!snap.exists()) return;
    renderGame(snap.val());
  });
  state.listeners.push(unsub);

  function renderGame(d) {
    if (d.status === 'closed' && (d.round||0) < 3) { render(`<div class="screen">${logo()}<p style="color:var(--muted)">Esta sesión ya está cerrada.</p><div class="btn-row"><button class="btn btn-secondary" onclick="PZ.showHome()">← Inicio</button></div></div>`); return; }

    if (d.status === 'collecting') {
      function tagsHTML() { return myTopics.map((t,i)=>`<span class="task-tag">${t}<button onclick="PZ._rgRt(${i})">✕</button></span>`).join(''); }
      PZ._rgRt = (i) => { myTopics.splice(i,1); document.getElementById('tw').innerHTML=tagsHTML(); };
      PZ._rgAt = () => { const v=document.getElementById('ti').value.trim(); if(!v)return; myTopics.push(v); document.getElementById('ti').value=''; document.getElementById('tw').innerHTML=tagsHTML(); };
      PZ._rgSubmitTopics = async () => {
        if (myTopics.length===0) { toast('⚠️ Agrega al menos un tema'); return; }
        try { await set(ref(db,`sessions/${code}/topicSubs/${pid}`), {name, topics:myTopics}); toast('✅ Temas enviados'); }
        catch(e){ toast(`❌ ${e.message}`,4000); }
      };
      render(`<div class="screen">
        ${logo()}
        <div class="badge">Proponer temas</div>
        <h2 style="font-family:'Syne',sans-serif;font-weight:800;font-size:1.4rem;margin:4px 0">Hola, ${name} 👋</h2>
        <p style="color:var(--muted);font-size:0.85rem;margin-bottom:16px">${d.title} · Escribe los temas que quieres que se prioricen.</p>
        <div class="tasks-tags-wrap" id="tw">${tagsHTML()}</div>
        <div class="tag-input-wrap">
          <input type="text" id="ti" placeholder="Agregar tema..." onkeydown="if(event.key==='Enter')PZ._rgAt()"/>
          <button class="btn btn-secondary" onclick="PZ._rgAt()" style="padding:14px 18px;flex-shrink:0">+ Agregar</button>
        </div>
        <div class="btn-row">
          <button class="btn btn-green" onclick="PZ._rgSubmitTopics()">Enviar mis temas ✓</button>
        </div>
        <p style="color:var(--muted);font-size:0.78rem;margin-top:16px">Puedes seguir editando y reenviar mientras el facilitador no cierre la recolección.</p>
      </div>`);
      return;
    }

    if (d.status === 'waiting') {
      render(`<div class="screen" style="text-align:center;padding-top:60px">
        ${logo()}
        <div style="font-size:3rem;margin-bottom:16px">🧘</div>
        <h2 style="font-family:'Syne',sans-serif;font-weight:800;font-size:1.4rem;margin-bottom:8px">Hola, ${name}</h2>
        <p style="color:var(--muted)">Esperando a que el facilitador inicie la Ronda 1...</p>
      </div>`);
      return;
    }

    if (d.status === 'active') {
      const already = d.roundVotes && d.roundVotes[d.round] && d.roundVotes[d.round][pid];
      if (already || submittedFor === d.round) { renderRoundWait(d); return; }
      if (d.round === 3) { renderFinalRank(d); } else { renderDiscard(d); }
      return;
    }

    if (d.status === 'round-result') {
      const rr = (d.roundResults && d.roundResults[d.round]) || {counts:{},eliminated:[]};
      const base = d.round===1 ? (d.allTopics||[]) : (d.roundResults && d.roundResults[d.round-1] ? d.roundResults[d.round-1].remainingAfter : d.remaining) || [];
      render(`<div class="screen">
        ${logo()}
        <div class="round-pill">${roundLabel(d.round)} · Resultado</div>
        <h2 style="font-family:'Syne',sans-serif;font-weight:800;font-size:1.3rem;margin-bottom:12px">${d.title}</h2>
        <p style="color:var(--muted);font-size:0.85rem;margin-bottom:12px">Comenten en grupo. Esperando al facilitador para seguir...</p>
        <div>${base.map((t,i)=>{const c=rr.counts?(rr.counts[t]||0):0; const out=(rr.eliminated||[]).includes(t); return `<div class="stat-card ${COLORS[i%COLORS.length]}"><div style="flex:1"><div class="task-text ${out?'elim-tag':''}">${t}</div><div style="font-size:0.7rem;opacity:0.6;margin-top:4px">${out?'❌ Descartado':'✅ Sigue'} · ${c} voto${c!==1?'s':''}</div></div></div>`;}).join('')}</div>
      </div>`);
      return;
    }

    if (d.status === 'closed' && d.round >= 3) {
      const rr = (d.roundResults && d.roundResults[3]) || {ranked:[]};
      render(`<div class="screen">
        ${logo()}
        <div class="badge">Resultado Final</div>
        <h2 style="font-family:'Syne',sans-serif;font-weight:800;font-size:1.4rem;margin-bottom:16px">${d.title}</h2>
        <div>${(rr.ranked||[]).map((item,idx)=>`<div class="stat-card ${COLORS[idx%COLORS.length]}"><div class="task-rank">${idx+1}</div><div style="flex:1"><div class="task-text">${item.text}</div><div style="font-size:0.7rem;opacity:0.6;margin-top:4px">Promedio: ${item.avg.toFixed(1)}</div></div>${idx===0?'<div style="font-size:1.3rem">👑</div>':''}</div>`).join('')}</div>
        <div class="btn-row"><button class="btn btn-primary" onclick="PZ.showHome()">← Inicio</button></div>
      </div>`);
      return;
    }
  }

  function renderDiscard(d) {
    const items = (d.remaining||d.allTopics||[]);
    const dc = discardCountFor(d.round);
    if (marked.length===0 || state._markedRound !== d.round) { marked = []; state._markedRound = d.round; }
    function cardsHTML() {
      return items.map((t,idx)=>`<div class="task-card ${COLORS[idx%COLORS.length]} ${marked.includes(t)?'discard-marked':''}" onclick="PZ._rgToggle('${idx}')" style="cursor:pointer">
        <div class="task-text">${t}</div>
        <div style="font-size:0.75rem;font-weight:700">${marked.includes(t)?'🗑 Descartar':''}</div>
      </div>`).join('');
    }
    PZ._rgToggle = (idxStr) => {
      const idx = parseInt(idxStr,10); const t = items[idx];
      if (marked.includes(t)) { marked = marked.filter(x=>x!==t); }
      else { if (marked.length >= dc) { toast(`⚠️ Solo puedes marcar ${dc}`); return; } marked.push(t); }
      const w = document.getElementById('cw'); if (w) w.innerHTML = cardsHTML();
      const btn = document.getElementById('sb'); if (btn) btn.disabled = marked.length !== dc;
    };
    PZ._rgSubmitDiscard = async () => {
      if (marked.length !== dc) { toast(`⚠️ Marca exactamente ${dc}`); return; }
      submittedFor = d.round;
      try { await set(ref(db,`sessions/${code}/roundVotes/${d.round}/${pid}`), {playerId:pid,name,discard:marked,submittedAt:serverTimestamp()}); toast('✅ Voto enviado'); }
      catch(e){ submittedFor=null; toast(`❌ ${e.message}`,4000); }
    };
    render(`<div class="screen">
      ${logo()}
      <div class="round-pill">${roundLabel(d.round)}</div>
      <h2 style="font-family:'Syne',sans-serif;font-weight:800;font-size:1.3rem;margin:4px 0">Hola, ${name} 👋</h2>
      <p style="color:var(--muted);font-size:0.8rem;margin-bottom:12px">${d.title} · Toca ${dc} temas para descartar. Solo tú ves esto.</p>
      <div id="cw">${cardsHTML()}</div>
      <div class="btn-row">
        <button class="btn btn-green" id="sb" disabled onclick="PZ._rgSubmitDiscard()">Enviar mi descarte ✓</button>
      </div>
    </div>`);
  }

  function renderFinalRank(d) {
    const items = d.remaining||[];
    if (orderItems.length===0) { orderItems = items.map((t,i)=>({text:t,color:COLORS[i%COLORS.length]})); orderItems.sort(()=>Math.random()-0.5); }
    function cardsHTML() {
      return orderItems.map((item,idx)=>`
        <div class="task-card ${item.color}" draggable="true" data-idx="${idx}"
          ondragstart="PZ._rgDs(${idx})" ondragenter="PZ._rgDe(${idx})" ondragend="PZ._rgDd()" ondragover="event.preventDefault()">
          <div class="task-rank">${idx+1}</div>
          <div class="task-text">${item.text}</div>
          <div class="task-arrows">
            <button class="arrow-btn" onclick="PZ._rgMv(${idx},-1)" ${idx===0?'disabled':''}>▲</button>
            <button class="arrow-btn" onclick="PZ._rgMv(${idx},1)" ${idx===orderItems.length-1?'disabled':''}>▼</button>
          </div>
          <div class="drag-handle">⠿</div>
        </div>`).join('');
    }
    function refresh() { const w=document.getElementById('cw'); if(w) w.innerHTML=cardsHTML(); }
    PZ._rgDs = (i) => { dragSrc=i; };
    PZ._rgDe = (i) => { if(dragSrc===null||dragSrc===i)return; const c=[...orderItems]; const[m]=c.splice(dragSrc,1); c.splice(i,0,m); orderItems=c; dragSrc=i; refresh(); };
    PZ._rgDd = () => { dragSrc=null; };
    PZ._rgMv = (i,dd) => { const t=i+dd; if(t<0||t>=orderItems.length)return; [orderItems[i],orderItems[t]]=[orderItems[t],orderItems[i]]; refresh(); };
    PZ._rgSubmitFinal = async () => {
      submittedFor = d.round;
      try { await set(ref(db,`sessions/${code}/roundVotes/3/${pid}`), {playerId:pid,name,order:orderItems.map(x=>x.text),submittedAt:serverTimestamp()}); toast('✅ ¡Prioridad enviada!'); }
      catch(e){ submittedFor=null; toast(`❌ ${e.message}`,4000); }
    };
    render(`<div class="screen">
      ${logo()}
      <div class="round-pill">${roundLabel(3)}</div>
      <h2 style="font-family:'Syne',sans-serif;font-weight:800;font-size:1.3rem;margin:4px 0">Hola, ${name} 👋</h2>
      <p style="color:var(--muted);font-size:0.78rem;margin-bottom:12px">Arrastra o usa ▲▼ · Nº1 = más importante. Solo tú ves esto.</p>
      <div id="cw">${cardsHTML()}</div>
      <div class="btn-row">
        <button class="btn btn-green" onclick="PZ._rgSubmitFinal()">Enviar mi prioridad ✓</button>
      </div>
    </div>`);
  }

  function renderRoundWait(d) {
    render(`<div class="screen" style="text-align:center;padding-top:60px">
      ${logo()}
      <div style="font-size:3rem;margin-bottom:16px">🧘</div>
      <h2 style="font-family:'Syne',sans-serif;font-weight:800;font-size:1.4rem;margin-bottom:8px">¡Listo, ${name}!</h2>
      <p style="color:var(--muted)">Tu voto de esta ronda quedó registrado.<br>Esperando a los demás...</p>
    </div>`);
  }
}

window.PZ = { showHome, showAdminSetup, showAdminPanel, showJoin, promptJoin, showResults, showWaiting,
  showModeSelect, showRoundsSetup, showRoundsAdminPanel, showRoundsGame,
  _rt:null,_at:null,_pt:null,_create:null,_join:null,_gj:null,_ds:null,_de:null,_dd:null,_mv:null,
  _submit:null,_sh:null,_start:null,_close:null,_copy:null,
  _rrt:null,_rat:null,_rSrc:null,_rTimer:null,_createRounds:null,
  _copyR:null,_closeCollecting:null,_startRound1:null,_forceCloseRound:null,_nextRound:null,_closeSessionR:null,
  _rgRt:null,_rgAt:null,_rgSubmitTopics:null,_rgToggle:null,_rgSubmitDiscard:null,
  _rgDs:null,_rgDe:null,_rgDd:null,_rgMv:null,_rgSubmitFinal:null };

showHome();
</script>
